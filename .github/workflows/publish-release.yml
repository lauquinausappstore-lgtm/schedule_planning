name: Publish supplied Android release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify supplied APK
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/app-release.apk release/SHA256SUMS \
            --verify-tag --draft --title "Dayline $RELEASE_TAG" \
            --notes "Dayline for Android 8.0 and newer. Download app-release.apk on your Android device and open it to install. This is the supplied release APK, published without rebuilding. SHA256SUMS is included for integrity verification."
          gh release edit "$RELEASE_TAG" --draft=false --latest
